<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser interaction boundary fixture</title>
    <script src="/main.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Browser interaction boundary fixture</h1>
      <p>This fixture checks controls inside an open shadow root and a same-origin iframe.</p>
      <nav><a href="/same-origin-frame.html">Open the frame page</a></nav>

      <form action="/api/interaction-search" method="post">
        <label>Search fixture <input name="query" value="interaction-local" /></label>
        <button type="submit">Submit fixture search</button>
      </form>

      <runtime-action id="shadow-host" data-api-root="api" data-api-name="interaction-shadow"></runtime-action>
      <iframe
        id="interaction-frame"
        title="Same-origin interaction frame"
        src="/same-origin-frame.html"
        width="420"
        height="120"
      ></iframe>
    </main>
  </body>
</html>
