<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nested scroll interaction fixture</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { font: 16px sans-serif; padding: 24px; box-sizing: border-box; }
      #nested-scroll { width: min(520px, 90vw); height: 220px; overflow-y: auto; border: 1px solid #555; }
      #nested-scroll-spacer { height: 680px; padding: 12px; box-sizing: border-box; }
      #nested-scroll-button { display: none; margin: 12px; }
    </style>
    <script src="/nested-scroll.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Nested scroll interaction fixture</h1>
      <div id="nested-scroll" aria-label="Scrollable result list">
        <div id="nested-scroll-spacer">Scroll this inner panel to reveal its action.</div>
        <button id="nested-scroll-button" type="button">Load more results</button>
      </div>
    </main>
  </body>
</html>
